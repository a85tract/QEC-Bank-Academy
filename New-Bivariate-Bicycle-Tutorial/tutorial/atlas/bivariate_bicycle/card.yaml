params:
  l: "positive cyclic order of x"
  m: "positive cyclic order of y"
  a_terms: "integer exponent pairs for the monomials of A, reduced modulo (l,m)"
  b_terms: "integer exponent pairs for the monomials of B, reduced modulo (l,m)"
construction:
  schema: qec-atlas-construction-v1
  op: {id: bivariate_bicycle, version: 1}
  inputs:
    A:
      ref: {kind: generator, id: bivariate_polynomial, version: 1}
      params:
        l: {instance_param: l}
        m: {instance_param: m}
        terms: {instance_param: a_terms}
      output: parity_check
    B:
      ref: {kind: generator, id: bivariate_polynomial, version: 1}
      params:
        l: {instance_param: l}
        m: {instance_param: m}
        terms: {instance_param: b_terms}
      output: parity_check
  output: checkmatrix
  match: exact-checkmatrix-v1
tier: T3
fit:
  platforms:
    [superconducting-long-range, neutral-atom-reconfigurable, modular-networked]
  tasks: [memory, modular-computation]
decoders:
  - id: bp-osd
    status: standard
    noise: "memoryless Pauli and phenomenological qLDPC benchmarks"
    notes: >-
      Belief propagation supplies soft reliabilities and ordered-statistics
      postprocessing repairs many failures caused by degeneracy and short
      Tanner-graph cycles. Performance belongs to the stated channel and
      stopping/OSD settings, not to the bare check matrix.
    refs: [roffe2020decoding, panteleev2021degenerate]
  - id: bp-osd
    status: research-grade
    noise: "circuit detector model for the seven-CNOT-layer extraction schedule"
    notes: >-
      The original end-to-end study reports a 0.8% circuit-level threshold
      for its BB memory family under the standard circuit-noise model,
      depth-seven extraction, and BP-OSD. It is not a decoder-independent
      threshold of every BB construction: changing the family, CNOT order,
      detector model, noise normalization, or postprocessing defines a
      different threshold experiment.
    refs: [bravyi2024bicycle]
  - id: mwpm
    status: research-grade
    noise: "BB symmetry reduction to toric-code-like cylinders"
    notes: >-
      A cylinder construction exposes matching subproblems and can be combined
      with BP and over-matching. Its certificate is the specific symmetry
      reduction; it does not turn every BB instance into independent toric
      codes.
    refs: [sahay2026matching]
realizations:
  - platform: "Kunlun long-range-coupled superconducting processor"
    status: demonstrated
    description: >-
      A [[18,4,4]] BB block used 32 transmons to execute all nonlocal
      weight-six checks and repeated syndrome cycles. The reported logical
      error per logical qubit per cycle was (8.91 +/- 0.17)%; this establishes
      feasibility, not below-threshold scaling and not a gross-code run.
    refs: [wang2026lowoverhead]
  - platform: "optimized Rydberg neutral-atom layout"
    status: proposed
    description: >-
      Gate routing and Rydberg interactions were co-designed for BB
      connectivity. The result is a numerical architecture proposal rather
      than a laboratory logical-memory demonstration.
    refs: [poole2025rydberg]
  - platform: "layered two-dimensional hardware"
    status: proposed
    description: >-
      Motion or communication embeds long-range BB checks in a locally
      connected device, including schedules that measure some costly checks
      less often. The altered cadence and circuit noise must be decoded as
      part of the proposal.
    refs: [berthusen2025local]
  - platform: "degree-five morphing-circuit layout"
    status: proposed
    description: >-
      A related BB family lowers connectivity from degree six to five and uses
      six CNOT rounds by morphing the code during extraction. It changes the
      family and detector model; it is not a cheaper schedule for every BB
      block.
    refs: [shaw2025morphing]
  - platform: "modular gross-code architecture"
    status: proposed
    description: >-
      An instruction set, compiler, and end-to-end resource model organize
      distance-12 and distance-18 BB modules into a computer. This closes an
      architecture gap but remains a proposal, not a hardware realization.
    refs: [yoder2025tour]
relations:
  - type: special_case_of
    target: two_bga
    how: >-
      Bivariate bicycle codes are the abelian two-block group-algebra codes
      for Z_l x Z_m; general 2BGA codes may use other groups and need not have
      a two-variable polynomial presentation.
    refs: [wang2023abelian, lin2023twoblock]
operations:
  - gate: "CNOT between identical BB blocks"
    mechanism: transversal
    level: "Clifford"
    cost: >-
      one aligned pairwise physical-CNOT layer; module transport, alignment,
      and correlated decoding are additional architecture costs
    origin: {kind: claimed, ref: yoder2025tour}
  - gate: "selected logical Clifford generators"
    mechanism: fold-transversal
    level: "Clifford"
    cost: >-
      a fold/permutation plus constant-depth physical Clifford layers; only
      symmetric BB instances with a resolved logical action qualify
    origin: {kind: claimed, ref: eberhardt2024fold}
  - gate: "logical Clifford operations through automorphisms"
    mechanism: fold-transversal
    level: "Clifford"
    cost: >-
      a certified Tanner-graph permutation and its physical routing; the
      induced symplectic action must be computed for the chosen block
    origin: {kind: claimed, ref: sayginel2025automorphisms}
  - gate: "inter-block Pauli measurements and Clifford surgery"
    mechanism: surgery
    level: "Clifford"
    cost: >-
      long-range ancilla patches, repeated measurements, and a joint decoder;
      the resource count belongs to the selected modular protocol
    origin: {kind: claimed, ref: yoder2025tour}
  - gate: "H / S / CNOT in the self-dual BB subfamily"
    mechanism: transversal
    level: "Clifford"
    cost: >-
      constant-depth physical layers on blocks satisfying the extra
      self-duality and twisted-torus conditions; not a gross-code claim
    origin: {kind: claimed, ref: liang2025selfdual}
