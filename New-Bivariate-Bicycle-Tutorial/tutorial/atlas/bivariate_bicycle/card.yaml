description: >-
  A CSS code family built by repeating a few parity-check moves on a grid whose
  opposite edges are identified. Each polynomial term says how far to move on
  that wrapped grid; the same moves become sparse matrix rows. A swapped,
  reversed copy supplies the partner checks, while a global rank defect can
  leave several logical qubits. The two matrix blocks are algebraic coordinate
  blocks, not by themselves a hardware layout.
claim_gaps:
  - {property: d, target: wanted:fast-distance}
views:
  - rung: R1
    type: symplectic-css-checks
    description: >-
      Expanding every polynomial monomial as a torus translation produces two
      sparse binary CSS matrices. Stacking their X and Z rows in symplectic
      form is the universal executable baseline used for rank, logical, and
      distance computations.
    origin:
      kind: derived
      converter: "bivariate_bicycle.build -> CheckMatrix.from_css"
      version: "v1"
    refs: [bravyi2024bicycle]
  - rung: R5
    type: bivariate-polynomial
    description: >-
      A and B are sparse elements of F_2[x,y]/(x^l-1,y^m-1). Monomials are
      torus translations, transpose reverses a translation, and the two CSS
      check families are assembled without solving pairwise commutation
      constraints.
    origin: {kind: canonical}
    refs: [bravyi2024bicycle]
  - rung: R5
    type: group-algebra
    description: >-
      The polynomial ring is the regular representation of the abelian group
      Z_l x Z_m. This view isolates the exact reason A and B commute and places
      BB codes inside two-block group-algebra codes without identifying the
      two families.
    origin: {kind: curated, ref: wang2023abelian}
    refs: [wang2023abelian, lin2023twoblock]
  - rung: R2
    type: homological
    description: >-
      The matrices form the three-term CSS complex R -> R^2 -> R with boundary
      maps [B;A] and [A|B]. Logical operators are middle homology classes, and
      the gross code's twelve logical qubits are the quotient dimension left
      after the two rank-66 boundary maps.
    origin:
      kind: derived
      converter: "bivariate_bicycle.build checkmatrix-to-CSS-complex"
      version: "v1"
    refs: [lin2023twoblock, bravyi2024bicycle]
  - rung: R4
    type: tanner-circuit
    description: >-
      Each weight-six check joins three qubits in each data layer. The Tanner
      incidence can be split into two planar degree-three coupling layers,
      turning sparse monomials into a concrete syndrome-extraction graph while
      keeping the schedule and detector model separate from the static code.
    origin: {kind: curated, ref: bravyi2024bicycle}
    refs: [bravyi2024bicycle, shaw2025morphing]
  - rung: R5
    type: quotient-module
    description: >-
      The common quotient R/(A,B) controls the number of encoded qubits.
      Polynomial factors and common roots explain when that quotient appears,
      why finite blocks can have high rate, and why the studied subclass is
      not an asymptotically good family.
    origin: {kind: curated, ref: postema2025existence}
    refs: [postema2025existence]
  - rung: R5
    type: anyon-koszul
    description: >-
      The same polynomial ideal can be read as excitation sectors, mobility
      constraints, and logical strings through a Koszul complex. This view
      exposes topological frustration and blocks the shortcut of declaring
      every finite BB code a trivial stack of independent toric codes.
    origin: {kind: curated, ref: chen2025anyon}
    refs: [chen2025anyon]
  - rung: R2
    type: toric-cylinder
    description: >-
      For decoding, selected symmetries reduce parts of the syndrome problem
      to toric-code-like cylinders on which matching applies. The reduction is
      an operational decoder dictionary, not a global phase equivalence.
    origin: {kind: curated, ref: sahay2026matching}
    refs: [sahay2026matching]
