logical |0> / |+> initialization", "mechanism": "measurement-based", "level": "stabilizer preparation", "cost": "prepare a physical product state, measure the complementary stabilizers for d rounds, and decode the spacetime record", "origin": {"kind": "claimed", "ref": "fowler2012surface"}}, {"gate": "logical Z / X readout", "mechanism": "measurement-based", "level": "stabilizer measurement", "cost": "destructively measure all data qubits in the selected basis and decode the final data/syndrome history", "origin": {"kind": "claimed", "ref": "fowler2012surface"}}, {"gate": "Pauli-frame update", "mechanism": "measurement-based", "level": "Clifford bookkeeping", "cost": "a classical frame update after decoded logical measurements; no immediate physical Pauli layer is required", "origin": {"kind": "claimed", "ref": "fowler2012surface"}}, {"gate": "T", "mechanism": "measurement-based", "level": "non-Clifford", "cost": "inject and distill a magic state, then consume it by gate teleportation; factory spacetime dominates", "origin": {"kind": "claimed", "ref": "bravyi2005magic"}}], "realizations": [{"platform": "Google superconducting square-grid processors", "status": "demonstrated", "description": "Scaling from distance 3 to distance 5 reduced logical error per cycle from the distance-3 ensemble average 3.028% \u00b1 0.023% to 2.914% \u00b1 0.016%. This is the 2023 distance-scaling result; it did not report the later Willow suppression factor.", "refs": ["google2023suppressing"]}, {"platform": "Google Willow superconducting processor", "status": "demonstrated", "description": "A distance-7 patch reached 0.143% \u00b1 0.003% logical error per cycle and each distance increase of two suppressed error by \u039b = 2.14 \u00b1 0.02, with logical lifetime beyond the best physical qubit.", "refs": ["google2024below"]}, {"platform": "Google Willow dynamic superconducting layouts", "status": "demonstrated", "description": "Hexagonal-connectivity, walking data/measure-role, and iSWAP-based surface-code schedules all showed distance-dependent error suppression, demonstrating that the code can be adapted to connectivity, leakage, and native-gate constraints.", "refs": ["eickbusch2024dynamic"]}, {"platform": "USTC Zuchongzhi 2.1 superconducting processor", "status": "demonstrated", "description": "A 17-qubit distance-3 Surface-17 patch executed repeated correction cycles, providing an independent superconducting realization of a planar surface-code memory.", "refs": ["zhao2022realization"]}, {"platform": "reconfigurable neutral-atom arrays", "status": "demonstrated", "description": "Movable atoms realized surface-code patches inside a multi-code logical processor and enabled transversal inter-patch entangling gates by aligning corresponding data qubits. This is a logical-operations demonstration, not a below-threshold surface-memory claim; for the distance-five and distance-seven surface blocks, logical input-state preparation was not itself fault-tolerant.", "refs": ["bluvstein2024logical"]}], "views": [{"rung": "R1", "type": "symplectic-css-checks", "description": "Expanding the two repetition-factor boundary maps gives sparse binary X and Z check matrices. Their stacked symplectic rows are the universal executable baseline used for commutation, rank, logical, and distance calculations.", "origin": {"kind": "derived", "converter": "surface.build HGP output -> CheckMatrix.from_css", "version": "v1"}, "refs": ["tillich2009quantum"]}, {"rung": "R2", "type": "hypergraph-product", "description": "Two open length-L repetition chains form the two axes. The two HGP qubit blocks are bit\u00d7bit and check\u00d7check, while X and Z checks let one parity map act at a time; open-chain corank is exactly what leaves one logical qubit rather than the toric code's two.", "origin": {"kind": "canonical"}, "refs": ["tillich2009quantum"]}, {"rung": "R2", "type": "homological", "description": "The checks are the boundary and coboundary maps of a relative chain complex. Logical strings are relative cycles modulo boundaries, and distance is the shortest nontrivial primal or dual relative cycle.", "origin": {"kind": "curated", "ref": "bravyi1998quantum"}, "refs": ["bravyi1998quantum", "bombin2007homological"]}, {"rung": "R5", "type": "statistical-mechanics", "description": "Error chains with a fixed syndrome become disorder sectors of a random-bond Ising model. Maximum-likelihood decoding compares their free energies; minimum-weight matching is the zero-temperature approximation that keeps energy but discards path entropy.", "origin": {"kind": "curated", "ref": "dennis2002topological"}, "refs": ["dennis2002topological", "wang2003confinement"]}, {"rung": "R5", "type": "zx", "description": "A phase-free ZX diagram and a CSS code encode the same binary linear subspace. In this language rough/smooth merge and split operations become spider maps, so lattice surgery is diagram rewriting rather than an opaque stabilizer schedule.", "origin": {"kind": "curated", "ref": "kissinger2022phasefree"}, "refs": ["kissinger2022phasefree", "debeaudrap2020zx", "bombin2023unifying"]}, {"rung": "R5", "type": "fermionic", "dialect": "quon", "description": "The toric bulk underlying the planar patch becomes a quantized graph: star and plaquette checks are unified as cycle operators, e/m duality is graph self-duality, and charged string diagrams expose the fermionic composite and twist-defect bookkeeping.", "origin": {"kind": "curated", "ref": "liu2019quantized"}, "refs": ["liu2017quon", "liu2019quantized"], "gap": {"target": "wanted:fermionic-compiler"}}, {"rung": "R5", "type": "tensor-network", "description": "The ground space is a PEPS whose virtual Z2 symmetry generates topological degeneracy, local indistinguishability, and anyonic excitations. The code's topological order is therefore a constraint on the local tensor, not merely a property asserted from its Hamiltonian.", "origin": {"kind": "curated", "ref": "schuch2010peps"}, "refs": ["schuch2010
